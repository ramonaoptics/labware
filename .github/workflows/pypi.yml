name: pypi
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm reads the version from the tags
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build --sdist --wheel --outdir dist/ .
      - run: twine check --strict dist/*
      - name: Check that the built version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: ls "dist/labware-${GITHUB_REF_NAME#v}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/labware/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
